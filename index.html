<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safrochain NFT - Keplr</title>
</head>
<body>
  <h1>Safrochain NFT - Mainnet</h1>
  <p>Mission DYMA : déployer un contrat et créer un NFT.</p>
  <button id="connect">Connecter Keplr</button>
  <p id="result"></p>
<button id="rpc">Tester Safrochain Mainnet</button>
<p id="rpc-result"></p>
<button id="wasm">Vérifier le contrat NFT</button>
<p id="wasm-result"></p>
<button id="prepare">Préparer le déploiement NFT</button>
<button id="deploy">Déployer le contrat NFT sur Mainnet</button>
<p id="deploy-result"></p>

<p id="prepare-result"></p>
<button id="estimate">Estimer les frais du déploiement</button>
<p id="estimate-result"></p>

  <script type="module">
    import { SigningCosmWasmClient } from "@cosmjs/cosmwasm-stargate";
    import { MsgStoreCode } from "cosmjs-types/cosmwasm/wasm/v1/tx";
    import { toBase64 } from "@cosmjs/encoding";

    const chainId = "safrochain-1";


    document.getElementById("prepare").onclick = async () => {
      const result = document.getElementById("prepare-result");

      try {
        if (!window.keplr) {
          throw new Error("Extension Keplr introuvable");
        }

        await window.keplr.enable(chainId);
        const key = await window.keplr.getKey(chainId);

        if (key.bech32Address !== expectedAddress) {
          throw new Error("Adresse différente du portefeuille DYMA");
        }

        const response = await fetch("/cw721_base_optimized.wasm");
        if (!response.ok) {
          throw new Error("Contrat WASM introuvable");
        }

        const wasm = new Uint8Array(await response.arrayBuffer());

        if (
          wasm.length !== 720307 ||
          wasm[0] !== 0 ||
          wasm[1] !== 97 ||
          wasm[2] !== 115 ||
          wasm[3] !== 109
        ) {
          throw new Error("Taille ou en-tête du contrat inattendu");
        }

        const gasLimit = 12000000;
        const feeUsaf = 600000;

        result.textContent =
          "PRÉPARATION UNIQUEMENT — AUCUNE TRANSACTION ENVOYÉE. " +
          "Réseau : " + chainId +
          " | Adresse : " + key.bech32Address +
          " | Contrat : " + wasm.length + " octets" +
          " | Limite gas : " + gasLimit +
          " | Frais prévus : " + (feeUsaf / 1000000) + " SAF";
      } catch (error) {
        result.textContent = "Erreur préparation : " + error.message;
      }
    };


    document.getElementById("deploy").onclick = async () => {
      const result = document.getElementById("deploy-result");
      const button = document.getElementById("deploy");

      if (button.disabled) return;

      let client;

      try {
        if (!window.keplr) {
          throw new Error("Extension Keplr introuvable");
        }

        await window.keplr.enable(chainId);
        const key = await window.keplr.getKey(chainId);

        if (key.bech32Address !== expectedAddress) {
          throw new Error("Adresse différente de celle utilisée sur DYMA");
        }

        const response = await fetch("/cw721_base_optimized.wasm");
        if (!response.ok) {
          throw new Error("Contrat WASM introuvable");
        }

        const wasm = new Uint8Array(await response.arrayBuffer());

        if (
          wasm.length !== 720307 ||
          wasm[0] !== 0 ||
          wasm[1] !== 97 ||
          wasm[2] !== 115 ||
          wasm[3] !== 109
        ) {
          throw new Error("Contrat WASM inattendu");
        }

        const gasLimit = 12000000;
        const feeUsaf = 600000;

        const confirmation = window.confirm(
          "ATTENTION : TRANSACTION PAYANTE SUR SAFROCHAIN MAINNET.\\n\\n" +
          "Opération : téléchargement du contrat NFT\\n" +
          "Adresse : " + key.bech32Address + "\\n" +
          "Taille : " + wasm.length + " octets\\n" +
          "Gas : " + gasLimit + "\\n" +
          "Frais : 0,6 SAF\\n\\n" +
          "Continuer vers la signature Keplr ?"
        );

        if (!confirmation) {
          result.textContent = "Déploiement annulé. Aucune transaction envoyée.";
          return;
        }

        button.disabled = true;
        result.textContent = "Connexion au réseau et préparation de la signature Keplr...";

        const signer = window.keplr.getOfflineSigner(chainId);

        client = await SigningCosmWasmClient.connectWithSigner(
          "https://rpc2.safrochain.network",
          signer
        );

        const fee = {
          amount: [{ denom: "usaf", amount: String(feeUsaf) }],
          gas: String(gasLimit)
        };

        const message = {
          typeUrl: "/cosmwasm.wasm.v1.MsgStoreCode",
          value: MsgStoreCode.fromPartial({
            sender: key.bech32Address,
            wasmByteCode: wasm
          })
        };

        result.textContent =
          "Signature Keplr en cours. Vérifie les frais avant d'accepter...";

        const tx = await client.signAndBroadcast(
          key.bech32Address,
          [message],
          fee,
          "Déploiement contrat NFT DYMA"
        );

        result.textContent =
          "Résultat de la transaction : code " + tx.code +
          " | Hash : " + tx.transactionHash +
          " | Gas utilisé : " + tx.gasUsed +
          " | Détails : " + (tx.rawLog || "aucun");

      } catch (error) {
        result.textContent = "Erreur déploiement : " + error.message;
      } finally {
        if (client) client.disconnect();
        button.disabled = false;
      }
    };

    document.getElementById("estimate").onclick = async () => {
      const result = document.getElementById("estimate-result");
      result.textContent = "Simulation en cours...";

      try {
        await window.keplr.enable(chainId);

        const key = await window.keplr.getKey(chainId);

        if (key.bech32Address !==
          "addr_safro1xvc6sj0qylk8mspqdcx8d3gllde3urwz73uqw2") {
          throw new Error("Adresse Keplr inattendue");
        }

        const signer = window.keplr.getOfflineSigner(chainId);

        const client = await SigningCosmWasmClient.connectWithSigner(
          "https://rpc2.safrochain.network",
          signer
        );

        const response = await fetch("/cw721_base_optimized.wasm");
        if (!response.ok) throw new Error("Fichier WASM introuvable");

        const wasm = new Uint8Array(await response.arrayBuffer());

        const msg = {
          typeUrl: "/cosmwasm.wasm.v1.MsgStoreCode",
          value: MsgStoreCode.fromPartial({
            sender: key.bech32Address,
            wasmByteCode: wasm
          })
        };

        const gas = await client.simulate(
          key.bech32Address,
          [msg],
          "Simulation déploiement NFT DYMA"
        );

        const gasAvecMarge = Math.ceil(gas * 1.3);
        const fraisUsaf = Math.ceil(gasAvecMarge * 0.05);

        result.textContent =
          "Gas simulé : " + gas +
          " | Gas avec marge : " + gasAvecMarge +
          " | Frais estimés : " +
          (fraisUsaf / 1000000).toFixed(6) + " SAF";

        client.disconnect();
      } catch (error) {
        result.textContent = "Erreur simulation : " + (error.stack || error.message);
      }
    };


    document.getElementById("wasm").onclick = async () => {
      const result = document.getElementById("wasm-result");
      result.textContent = "Chargement du contrat...";

      try {
        const response = await fetch("/cw721_base_optimized.wasm");

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const wasm = new Uint8Array(await response.arrayBuffer());

        const validHeader =
          wasm.length >= 8 &&
          wasm[0] === 0 &&
          wasm[1] === 97 &&
          wasm[2] === 115 &&
          wasm[3] === 109;

        if (!validHeader) {
          throw new Error("En-tête WASM invalide");
        }

        result.textContent =
          "Contrat NFT chargé ! Taille : " +
          wasm.length +
          " octets.";
      } catch (error) {
        result.textContent = "Erreur : " + error.message;
      }
    };

    document.getElementById("rpc").onclick = async () => {
      const result = document.getElementById("rpc-result");
      result.textContent = "Vérification du réseau...";

      try {
        const response = await fetch(
          "https://rpc2.safrochain.network/status"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        const info = data.result;

        if (info.node_info.network !== chainId) {
          throw new Error("Réseau inattendu : " + info.node_info.network);
        }

        result.textContent =
          "Mainnet connecté ! Bloc : " +
          info.sync_info.latest_block_height +
          " | Synchronisation : " +
          info.sync_info.catching_up;
      } catch (error) {
        result.textContent = "Erreur RPC : " + error.message;
      }
    };
    const expectedAddress =
      "addr_safro1xvc6sj0qylk8mspqdcx8d3gllde3urwz73uqw2";

    document.getElementById("connect").onclick = async () => {
      const result = document.getElementById("result");

      try {
        if (!window.keplr) {
          throw new Error("Extension Keplr introuvable.");
        }

        result.textContent = "Connexion à Keplr en cours...";

        await window.keplr.enable(chainId);

        const key = await window.keplr.getKey(chainId);
        const address = key.bech32Address;

        if (address !== expectedAddress) {
          result.textContent =
            "Attention : adresse différente de celle connectée à DYMA : " +
            address;
          return;
        }

        result.textContent =
          "Connexion réussie ! Adresse Keplr : " + address;
      } catch (error) {
        result.textContent = "Erreur : " + error.message;
      }
    };
  </script>

  <div style="margin: 20px 0;">
    <button id="instantiate-nft">Créer la collection NFT sur Mainnet</button>
    <p id="instantiate-result"></p>
  </div>

  <script type="module">
    import { SigningCosmWasmClient } from "@cosmjs/cosmwasm-stargate";

    const button = document.getElementById("instantiate-nft");
    const result = document.getElementById("instantiate-result");
    const chainId = "safrochain-1";
    const expectedAddress =
      "addr_safro1xvc6sj0qylk8mspqdcx8d3gllde3urwz73uqw2";

    button.onclick = async () => {
      try {
        if (!window.keplr) throw new Error("Keplr introuvable.");

        await window.keplr.enable(chainId);
        const key = await window.keplr.getKey(chainId);

        if (key.bech32Address !== expectedAddress) {
          throw new Error("Adresse Keplr différente de celle de DYMA.");
        }

        const msg = {
          name: "Safrochain Genesis Cube",
          symbol: "SGC",
          collection_info_extension: null,
          minter: null,
          creator: null,
          withdraw_address: null
        };

        const fee = {
          amount: [{ denom: "usaf", amount: "150000" }],
          gas: "2000000"
        };

        if (!window.confirm(
          "Créer la collection NFT sur Safrochain Mainnet ?\\n" +
          "Code ID : 21\\n" +
          "Gas : 2000000\\n" +
          "Frais prévus : 0,15 SAF\\n\\n" +
          "Keplr peut afficher des frais différents."
        )) return;

        button.disabled = true;
        result.textContent = "Signature Keplr en attente...";

        const signer = window.keplr.getOfflineSigner(chainId);
        const client = await SigningCosmWasmClient.connectWithSigner(
          "https://rpc2.safrochain.network",
          signer
        );

        result.textContent = "Instanciation en cours...";

        const tx = await client.instantiate(
          key.bech32Address,
          21,
          msg,
          "Safrochain Genesis Cube",
          fee,
          { memo: "Création collection NFT DYMA" }
        );

        result.textContent =
          "Collection créée ! Adresse : " + tx.contractAddress +
          " | Hash : " + tx.transactionHash;
      } catch (error) {
        result.textContent = "Erreur instanciation : " + error.message;
      } finally {
        button.disabled = false;
      }
    };
  </script>

  <div style="margin: 20px 0;">
    <button id="mint-nft">Créer mon NFT sur Mainnet</button>
    <p id="mint-result"></p>
  </div>

  <script type="module">
    import { SigningCosmWasmClient } from "@cosmjs/cosmwasm-stargate";

    const button = document.getElementById("mint-nft");
    const result = document.getElementById("mint-result");

    const chainId = "safrochain-1";
    const owner = "addr_safro1xvc6sj0qylk8mspqdcx8d3gllde3urwz73uqw2";
    const contract = "addr_safro173ghrnww3uxnqxcj302scs78kmfyynq90afcttxenwy5mewrx03sx6dejz";

    button.onclick = async () => {
      try {
        if (!window.keplr) throw new Error("Keplr introuvable.");

        await window.keplr.enable(chainId);
        const key = await window.keplr.getKey(chainId);

        if (key.bech32Address !== owner) {
          throw new Error("Adresse Keplr différente de celle de DYMA.");
        }

        const msg = {
          mint: {
            token_id: "genesis-cube-001",
            owner: owner,
            token_uri: null,
            extension: null
          }
        };

        const fee = {
          amount: [{ denom: "usaf", amount: "150000" }],
          gas: "2000000"
        };

        if (!window.confirm(
          "Créer le NFT genesis-cube-001 sur Mainnet ?\n" +
          "Frais prévus : 0,15 SAF\n" +
          "Gas : 2000000\n\n" +
          "Keplr peut afficher des frais différents."
        )) return;

        button.disabled = true;
        result.textContent = "Connexion à Keplr...";

        const signer = window.keplr.getOfflineSigner(chainId);
        const client = await SigningCosmWasmClient.connectWithSigner(
          "https://rpc2.safrochain.network",
          signer
        );

        result.textContent = "Signature Keplr en attente...";

        const tx = await client.execute(
          owner,
          contract,
          msg,
          fee,
          "Création NFT genesis-cube-001 DYMA"
        );

        result.textContent =
          "NFT créé ! Token ID : genesis-cube-001" +
          " | Hash : " + tx.transactionHash +
          " | Gas utilisé : " + tx.gasUsed;
      } catch (error) {
        result.textContent = "Erreur mint : " + error.message;
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
